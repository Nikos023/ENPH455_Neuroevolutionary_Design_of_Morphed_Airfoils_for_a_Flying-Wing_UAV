[NEAT]
fitness_criterion       = max
fitness_threshold       = 9999999.0
pop_size                = 30
reset_on_extinction     = False
no_fitness_termination  = False

[DefaultGenome]
num_inputs              = 11
num_outputs             = 10
num_hidden              = 0
initial_connection      = unconnected
feed_forward            = True
enabled_default         = True
enabled_mutate_rate     = 0.01
enabled_rate_to_true_add = 0.0
enabled_rate_to_false_add = 0.0

single_structural_mutation = true
structural_mutation_surer = default

activation_default      = tanh
activation_options      = tanh
activation_mutate_rate  = 0.00

aggregation_default     = sum
aggregation_options     = sum
aggregation_mutate_rate = 0.0

bias_init_type          = gaussian
bias_init_mean          = 0.0
bias_init_stdev         = 0.2
bias_max_value          = 20.0
bias_min_value          = -20.0

bias_mutate_power       = 0.08
bias_mutate_rate        = 0.15
bias_replace_rate       = 0.02

response_init_type      = gaussian
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = 0.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

weight_init_type        = gaussian
weight_init_mean        = 0.0
weight_init_stdev       = 0.3
weight_max_value        = 20.0
weight_min_value        = -20.0

weight_mutate_power     = 0.15
weight_mutate_rate      = 0.35
weight_replace_rate     = 0.05

compatibility_disjoint_coefficient = 1.2
compatibility_weight_coefficient   = 1.0
conn_add_prob            = 0.10
conn_delete_prob         = 0.02

node_add_prob            = 0.10
node_delete_prob         = 0.01

[DefaultSpeciesSet]
compatibility_threshold = 3.2

[DefaultStagnation]
species_fitness_func    = max
max_stagnation          = 60
species_elitism         = 4

[DefaultReproduction]
elitism                 = 2
survival_threshold      = 0.5
min_species_size        = 2